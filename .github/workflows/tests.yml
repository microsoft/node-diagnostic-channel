name: Integration Tests CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  basic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # Continue running all Node.js versions even if one fails
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run build
    - name: Run unit tests (diagnostic-channel)
      run: |
        cd src/diagnostic-channel
        npm test
    - name: Run unit tests (without database dependencies)
      run: |
        cd src/diagnostic-channel-publishers
        npm run build
        # Run only unit tests that don't require database connections
        npm run test:unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false  # Continue running all Node.js versions even if one fails
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0']
    env:
      MYSQL_DATABASE: test_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      SQL_SERVER_PASSWORD: yourStrong(!)Password
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}
    - name: Set up MySQL
      timeout-minutes: 3
      run: |
        echo "MySQL setup disabled for now"
    - name: Start SQL Server
      timeout-minutes: 3
      run: |
        docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=${{ env.SQL_SERVER_PASSWORD }}' -p 14330:1433 -d mcr.microsoft.com/mssql/server:2019-latest
    - name: Start PostgreSQL
      timeout-minutes: 3
      run: |
        docker run -e 'POSTGRES_USER=${{ env.POSTGRES_USER }}' -e 'POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}' -e 'POSTGRES_DB=postgres' -e 'POSTGRES_HOST=127.0.0.1' -p 5455:5432 -d postgres:13
    - name: Wait for services
      timeout-minutes: 5
      run: |
        echo "Waiting for database services to be ready..."
        
        # Wait for MongoDB (up to 2 minutes)
        for i in {1..24}; do
          if nc -z localhost 27017; then
            echo "MongoDB is ready"
            break
          fi
          echo "Waiting for MongoDB... (attempt $i/24)"
          sleep 5
        done
        
        # Wait for MySQL (up to 2 minutes)  
        echo "MySQL tests disabled - skipping readiness check"
        
        # Wait for SQL Server (up to 2 minutes)
        for i in {1..24}; do
          if nc -z localhost 14330; then
            echo "SQL Server is ready"
            break
          fi
          echo "Waiting for SQL Server... (attempt $i/24)"
          sleep 5
        done
        
        # Wait for PostgreSQL (up to 2 minutes)
        for i in {1..24}; do
          if nc -z localhost 5455; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... (attempt $i/24)"
          sleep 5
        done
        
        echo "Service readiness check complete"
    - run: npm install
    - run: npm run build
    - name: Run unit tests (always succeeds independently)
      run: |
        cd src/diagnostic-channel-publishers
        npm run test:unit
    - name: Run integration tests (separate from unit tests)
      timeout-minutes: 10
      continue-on-error: true  # Don't fail the workflow if integration tests fail
      run: |
        cd src/diagnostic-channel-publishers
        echo "Current environment variables:"
        env | grep -E "(MYSQL|NODE|DATABASE)" || true
        echo "Running integration tests (real database connections)"
        # Run integration tests that connect to real databases
        npm run test:integration

