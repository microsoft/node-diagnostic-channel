name: Integration Tests CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  basic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run build
    - name: Run unit tests (diagnostic-channel)
      run: |
        cd src/diagnostic-channel
        npm test
    - name: Run unit tests (without database dependencies)
      run: |
        cd src/diagnostic-channel-publishers
        npm run build
        # Run only tests that don't require database connections
        ./node_modules/.bin/mocha ./dist/tests/console.spec.js ./dist/tests/winston.spec.js ./dist/tests/azure-coretracing.spec.js

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0']
    env:
      MYSQL_DATABASE: test_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      SQL_SERVER_PASSWORD: yourStrong(!)Password
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}
    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.MYSQL_DATABASE }};' -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }}
    - name: Start SQL Server
      run: |
        docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=${{ env.SQL_SERVER_PASSWORD }}' -p 14330:1433 -d mcr.microsoft.com/mssql/server:2019-latest
    - name: Start PostgreSQL
      run: |
        docker run -e 'POSTGRES_USER=${{ env.POSTGRES_USER }}' -e 'POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}' -e 'POSTGRES_DB=postgres' -e 'POSTGRES_HOST=127.0.0.1' -p 5455:5432 -d postgres:13
    - name: Wait for services
      run: |
        sleep 10
        # Test connections
        nc -z localhost 27017 || echo "MongoDB not ready"
        nc -z localhost 3306 || echo "MySQL not ready"  
        nc -z localhost 14330 || echo "SQL Server not ready"
        nc -z localhost 5455 || echo "PostgreSQL not ready"
    - run: npm install
    - run: npm run build
    - name: Run full integration tests
      run: |
        cd src/diagnostic-channel-publishers
        npm test

