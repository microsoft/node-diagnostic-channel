
version: 2
updates:
  # Root package.json (now manages workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "*eslint*"
          - "*mocha*"
          - "*typescript*"
      development-dependencies:
        patterns:
          - "@types/*"
          - "*eslint*"
          - "*mocha*"
          - "*typescript*"
    
  # Diagnostic channel core package
  - package-ecosystem: "npm"
    directory: "/src/diagnostic-channel"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(diagnostic-channel)"
    open-pull-requests-limit: 5
      
  # Diagnostic channel publishers package
  - package-ecosystem: "npm"
    directory: "/src/diagnostic-channel-publishers"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(publishers)"
    open-pull-requests-limit: 5
      
  # Sample application
  - package-ecosystem: "npm"
    directory: "/sample"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(sample)"
    open-pull-requests-limit: 3
